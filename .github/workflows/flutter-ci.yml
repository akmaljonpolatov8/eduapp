name: Flutter CI

on:
  push:
    branches: [develop, main]
    paths: ['mobile/**']
  pull_request:
    branches: [develop]
    paths: ['mobile/**']

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Dependencylarni olish
        run: flutter pub get

      - name: Kod tahlili
        run: flutter analyze

      - name: Testlar
        run: flutter test --coverage

  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: APK build
        run: flutter build apk --release

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: educenter-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
